<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<div class="login-page">
  <div class="login-glow login-glow--top"></div>
  <div class="login-glow login-glow--bottom"></div>

  <div class="login-card">

    <div class="login-brand">
      <div class="login-brand__icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 2L12.5 7.5H18L13.5 11L15.5 17L10 13.5L4.5 17L6.5 11L2 7.5H7.5L10 2Z" fill="#e8607a" opacity="0.9"/>
        </svg>
      </div>
    </div>

    <h1 class="login-title">Crea account</h1>
    <p class="login-desc">Registrati per iniziare ad usare il servizio</p>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">

      <!-- Email -->
      <div class="login-field" [class.login-field--error]="form.get('email')?.invalid && form.get('email')?.touched">
        <label class="login-label" for="email">Email</label>
        <div class="login-input-wrap">
          <svg class="login-input-icon" width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M3 6l7 5 7-5M4 15h12a1 1 0 001-1V6a1 1 0 00-1-1H4a1 1 0 00-1 1v8a1 1 0 001 1z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            class="login-input"
            type="email"
            id="email"
            formControlName="email"
            placeholder="nome@esempio.it"
            autocomplete="email"
          />
        </div>
        <span class="login-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
          Inserisci un'email valida
        </span>
      </div>

      <!-- Password -->
      <div class="login-field" [class.login-field--error]="form.get('password')?.invalid && form.get('password')?.touched">
        <label class="login-label" for="password">Password</label>
        <div class="login-input-wrap">
          <svg class="login-input-icon" width="16" height="16" viewBox="0 0 20 20" fill="none">
            <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
            <path d="M7 9V6.5a3 3 0 016 0V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="10" cy="13.5" r="1.2" fill="currentColor"/>
          </svg>
          <input
            class="login-input"
            type="password"
            id="password"
            formControlName="password"
            placeholder="Minimo 6 caratteri"
            autocomplete="new-password"
          />
        </div>
        <span class="login-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
          Minimo 6 caratteri
        </span>

        <!-- Strength bar -->
        <div class="strength-bar" *ngIf="form.get('password')?.value">
          <div
            class="strength-bar__fill"
            [style.width]="passwordStrength.percent + '%'"
            [class]="'strength-bar__fill--' + passwordStrength.level">
          </div>
          <span class="strength-bar__label" [class]="'strength-label--' + passwordStrength.level">
            {{ passwordStrength.label }}
          </span>
        </div>
      </div>

      <!-- Conferma Password -->
      <div class="login-field" [class.login-field--error]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched || (form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched)">
        <label class="login-label" for="confirmPassword">Conferma password</label>
        <div class="login-input-wrap">
          <svg class="login-input-icon" width="16" height="16" viewBox="0 0 20 20" fill="none">
            <path d="M4 10l4 4 8-8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <input
            class="login-input"
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Ripeti la password"
            autocomplete="new-password"
          />
        </div>
        <span class="login-error" *ngIf="form.errors?.['passwordMismatch'] && form.get('confirmPassword')?.touched">
          Le password non coincidono
        </span>
      </div>

      <!-- Termini e condizioni -->
      <label class="login-remember">
        <input type="checkbox" class="login-checkbox-input" formControlName="terms" />
        <span class="login-checkbox-box"></span>
        <span class="login-checkbox-label">
          Accetto i <a href="#" class="login-terms-link">Termini di servizio</a> e la
          <a href="#" class="login-terms-link">Privacy Policy</a>
        </span>
      </label>
      <span class="login-error" style="margin-top: -0.6rem; padding-left: 26px;"
        *ngIf="form.get('terms')?.invalid && form.get('terms')?.touched">
        Devi accettare i termini per procedere
      </span>

      <!-- Alert errore server -->
      <div class="login-alert" *ngIf="error">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 5v3.5M8 11h.01" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        {{ error }}
      </div>

      <!-- Alert successo -->
      <div class="login-success" *ngIf="success">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" stroke="currentColor" stroke-width="1.4"/>
          <path d="M5 8l2.5 2.5L11 5.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Account creato!
      </div>

      <button class="login-btn" type="submit" [disabled]="loading || form.invalid">
        <span [style.opacity]="loading ? '0' : '1'">Registrati</span>
        <span class="login-spinner" [style.opacity]="loading ? '1' : '0'" aria-hidden="true"></span>
      </button>
    </form>

    <div class="login-divider"><span>oppure</span></div>

    <p class="login-register">
      Hai già un account? <a routerLink="/login">Accedi</a>
    </p>

  </div>
</div>
