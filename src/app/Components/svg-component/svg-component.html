<div class="welcome-container" [class.leaving]="isLeaving" #container>
  <svg
    width="100%"
    viewBox="0 0 900 330"
    role="img"
    xmlns="http://www.w3.org/2000/svg">

    <defs>
      <mask id="welcomeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330">
        <rect #welcomeRect x="0" y="10" width="0" height="105" fill="white"/>
      </mask>
      <mask id="matheiMask" maskUnits="userSpaceOnUse" x="0" y="0" width="900" height="330">
        <rect #matheiRect x="409" y="185" width="0" height="95" fill="white"/>
      </mask>
    </defs>

    <text x="450" y="95" text-anchor="middle"
      font-family="'Dancing Script', cursive" font-size="90" font-weight="700"
      fill="#c26b84" mask="url(#welcomeMask)">
      Welcome to
    </text>

    <g transform="translate(226, 145)">
      <line #path1 x1="0" y1="80" x2="130" y2="80"
        fill="none" stroke="#ddb8c2" stroke-width="2.25" stroke-linecap="round"/>
      <line #path2 x1="65" y1="10" x2="65" y2="150"
        fill="none" stroke="#ddb8c2" stroke-width="2.25" stroke-linecap="round"/>
      <path #path3 d="M10,80 C25,80 30,25 50,25 C70,25 75,135 95,135 C110,135 115,80 130,80"
        fill="none" stroke="#a84f6a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path #path4 d="M 43.75,25 A 6.25,6.25 0 1,0 56.25,25 A 6.25,6.25 0 1,0 43.75,25"
        fill="#a84f6a" stroke="none"/>
      <path #path5 d="M 88.75,135 A 6.25,6.25 0 1,0 101.25,135 A 6.25,6.25 0 1,0 88.75,135"
        fill="#a84f6a" stroke="none"/>
    </g>

    <line #path6 x1="384" y1="155" x2="384" y2="295"
      fill="none" stroke="#9a6070" stroke-width="2.25" stroke-linecap="round"/>

    <text x="409" y="248"
      font-family="'Dancing Script', cursive" font-size="74" font-weight="700"
      fill="#c26b84" letter-spacing="1" mask="url(#matheiMask)">
      Mathei
    </text>
  </svg>
</div>
