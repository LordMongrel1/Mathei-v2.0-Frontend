<div class="main-wrapper">
  <div class="input-row">
    <input type="text" class="textarea" #mathInput
           [value]="textValue"
           (keydown)="handleKey($event)">

    <button class="img-btn" (click)="fileInput.click()" [class.confirmed]="showConfirm">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        @if (!showConfirm) {
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        } @else {
          <polyline points="20 6 9 17 4 12" class="check-path"/>
        }
      </svg>
    </button>

    <input #fileInput type="file"
           accept="image/png,image/jpeg,image/webp,image/gif"
           style="display:none"
           (change)="onFileSelected($event)">
  </div>

  <div class="keyboard-wrapper">

    <div class="panel panel-left">
      @if (!isAdvanced) {
        <div class="grid-2x4">
          @for (sym of leftBase; track sym.label) {
            <button (click)="addSymbol(sym.label, sym.latex, sym.offset ?? 0)"
                    class="key-btn gray-key">{{ sym.label }}</button>
          }
        </div>
      } @else {
        <div class="grid-functions-scroll">
          @for (sym of functions; track sym.label) {
            <button (click)="addSymbol(sym.label, sym.latex, sym.offset ?? 0)"
                    class="key-btn function-key">{{ sym.label }}</button>
          }
        </div>
      }
    </div>

    <div class="panel panel-center">
      <div class="grid-4x4">
        @for (sym of centerPanel; track sym.label) {
          <button (click)="addSymbol(sym.label, sym.latex, sym.offset)"
                  [class]="'key-btn ' + (sym.type === 'number' ? 'white-key' : 'gray-key')">
            {{ sym.label }}
          </button>
        }
      </div>
    </div>

    <div class="panel panel-right">
      <button (click)="toggleAdvanced()" class="key-btn action-key"
              [class.active-mode]="isAdvanced">
        {{ isAdvanced ? 'Base' : 'Funzioni' }}
      </button>
      <div class="nav-arrows">
        <button class="key-btn gray-key" (click)="moveCursor('left')">←</button>
        <button class="key-btn gray-key" (click)="moveCursor('right')">→</button>
      </div>
      <button class="key-btn gray-key delete-key" (click)="cancelText()">⌫</button>
      <button class="key-btn enter-key" (click)="sendToBackend()">⏎</button>
    </div>

  </div>
</div>
