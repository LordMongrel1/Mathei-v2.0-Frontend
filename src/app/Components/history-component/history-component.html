<div class="history-page">

  <div class="bg-grid" aria-hidden="true"></div>

  <header class="history-header">
    <button class="back-btn" (click)="goBack()" title="Torna al plotter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="header-title">
      <span class="title-accent">f(x)</span>
      <h1>Cronologia</h1>
    </div>

    <div class="header-count" *ngIf="!loading && !error">
      {{ functions.length }} funzion{{ functions.length === 1 ? 'e' : 'i' }}
    </div>

    <!-- Action buttons -->
    <div class="header-actions">
      <button class="action-btn action-danger"
              (click)="deleteAll()"
              [disabled]="functions.length === 0 || loading || deletingAll"
              title="Elimina tutta la cronologia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
          <path d="M10 11v6M14 11v6"/>
          <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
        </svg>
      </button>

      <button class="action-btn action-neutral" (click)="logout()" title="Esci">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="history-main">

    <!-- Loading skeleton -->
    <ng-container *ngIf="loading && functions.length === 0">
      <div class="skeleton-list">
        <div class="skeleton-item" *ngFor="let i of [1,2,3,4,5]"></div>
      </div>
    </ng-container>

    <!-- Error state -->
    <div class="empty-state" *ngIf="error && functions.length === 0">
      <div class="empty-icon">⚠</div>
      <p>Errore nel caricamento.<br>Controlla la connessione.</p>
      <button class="retry-btn" (click)="loadHistory()">Riprova</button>
    </div>

    <!-- Empty state -->
    <div class="empty-state" *ngIf="!loading && !error && functions.length === 0">
      <div class="empty-icon">∅</div>
      <p>Nessuna funzione salvata.<br>Inizia a plottare!</p>
      <button class="retry-btn" (click)="goBack()">Vai al plotter</button>
    </div>

    <!-- Function list -->
    <ul class="function-list" *ngIf="functions.length > 0">
      <li class="function-card"
          *ngFor="let fn of functions; trackBy: trackById; let i = index"
          [style.animation-delay]="(i * 40) + 'ms'"
          [class.is-deleting]="deletingIds.has(fn.id)"
          (click)="goToPlotter(fn)">

        <span class="card-index">{{ i + 1 }}</span>

        <div class="card-body">
          <code class="card-formula">{{ fn.function }}</code>
        </div>

        <!-- Per-card delete -->
        <button class="card-delete"
                (click)="deleteFunction($event, fn.id)"
                title="Elimina funzione"
                aria-label="Elimina funzione">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
            <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/>
          </svg>
        </button>

        <div class="card-arrow" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </li>
    </ul>

    <!-- Load more -->
    <div class="load-more-wrap" *ngIf="functions.length > 0 && hasMore">
      <button class="load-more-btn"
              [disabled]="loading"
              (click)="loadMore()">
        <span *ngIf="!loading">Carica altri</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>
    </div>

    <p class="end-label" *ngIf="functions.length > 0 && !hasMore && !loading">
      — fine —
    </p>

  </main>

  <app-confirm-dialog></app-confirm-dialog>
</div>
